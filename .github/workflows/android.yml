name: android

on:
  pull_request:
    branches: [nx2]
  push:
    branches: [nx2, "android/**", "ccr-*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: android-arm64 apk
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2000M
      CCACHE_COMPILERCHECK: content
      # Gradle's .cxx folders are named by a config hash; relative paths keep cache hits stable.
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # getGitVersion() names the build from git describe.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The runner image has the SDK; add the NDK, CMake and platform the Gradle build asks for,
      # and glslangValidator for the host shaders.
      - name: Install Android packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools ccache
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.5" > /dev/null

      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-android-

      # Restored and saved separately so a failed build still keeps the objects it compiled.
      - name: Restore compiler objects
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: objects-android-arm64-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            objects-android-arm64-

      - name: Build APK
        shell: bash
        working-directory: src/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon "-PYUZU_ANDROID_ARGS=-DUSE_CCACHE=ON" assembleMainlineRelease
          apk=$(find app/build/outputs/apk/mainline/release -name '*.apk' | head -1)
          cp "$apk" "$GITHUB_WORKSPACE/lichii-android-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$GITHUB_WORKSPACE/lichii-android-arm64.apk" \
            | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|application-icon-640|native-code):"
          ccache --show-stats

      # Gradle stops at the first native error; list every failing file so they can be fixed in one pass.
      - name: List native build errors
        if: failure()
        shell: bash
        working-directory: src/android/app
        run: |
          build_ninja=$(find .cxx -name build.ninja -path '*arm64-v8a*' | head -1)
          [ -n "$build_ninja" ] || exit 0
          "$ANDROID_HOME/cmake/3.31.5/bin/ninja" -C "$(dirname "$build_ninja")" -k 0 yuzu-android 2>&1 \
            | grep -E -A3 "error:|FAILED:|undefined (reference|symbol)" | head -600 || true

      - name: Save compiler objects
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: objects-android-arm64-${{ github.sha }}-${{ github.run_attempt }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lichii-android-arm64-${{ github.sha }}
          path: lichii-android-arm64.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
